name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS app
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$app_version" = "$tag_version"

      - name: Test
        run: |
          xcodebuild test \
            -project WindowSaver.xcodeproj \
            -scheme WindowSaver \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        run: |
          xcodebuild archive \
            -project WindowSaver.xcodeproj \
            -scheme WindowSaver \
            -configuration Release \
            -archivePath "$PWD/build/WindowSaver.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package release assets
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            "build/WindowSaver.xcarchive/Products/Applications/Window Saver.app" \
            release/WindowSaver-macOS.zip
          shasum -a 256 release/WindowSaver-macOS.zip > release/WindowSaver-macOS.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Window Saver $GITHUB_REF_NAME" \
            --generate-notes

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS app
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$app_version" = "$tag_version"

      - name: Test
        run: |
          xcodebuild test \
            -project WindowSaver.xcodeproj \
            -scheme WindowSaver \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        run: |
          xcodebuild archive \
            -project WindowSaver.xcodeproj \
            -scheme WindowSaver \
            -configuration Release \
            -archivePath "$PWD/build/WindowSaver.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package release assets
        run: |
          app_path="build/WindowSaver.xcarchive/Products/Applications/Window Saver.app"
          # Xcode leaves an executable-only ad-hoc signature when signing is disabled.
          # Re-sign the bundle so its resources are sealed before it is distributed.
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            release/WindowSaver-macOS.zip
          shasum -a 256 release/WindowSaver-macOS.zip > release/WindowSaver-macOS.zip.sha256

          mkdir -p dmg-contents
          cp -R "$app_path" dmg-contents/Window\ Saver.app
          ln -s /Applications dmg-contents/Applications
          approval_link="dmg-contents/Open Privacy & Security.webloc"
          plutil -create xml1 "$approval_link"
          plutil -insert URL -string \
            "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension" \
            "$approval_link"
          hdiutil create \
            -volname "Window Saver" \
            -srcfolder dmg-contents \
            -ov \
            -format UDZO \
            release/WindowSaver.dmg
          shasum -a 256 release/WindowSaver.dmg > release/WindowSaver.dmg.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Window Saver $GITHUB_REF_NAME" \
            --generate-notes
